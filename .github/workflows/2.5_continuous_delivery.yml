name: 2.5 - Continuous Delivery (Staging)
run-name: "Deploy & Validate Staging - ${{ inputs.commit_sha || github.sha }}"

permissions: write-all

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA of the images to test/deploy (leave empty for default)"
        required: false
        type: string

env:
  REGISTRY: ${{ vars.REGISTRY }}
  MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
  MLFLOW_EXPERIMENT_NAME: ${{ vars.MLFLOW_EXPERIMENT_NAME }}
  MLFLOW_MODEL_NAME: ${{ vars.MLFLOW_MODEL_NAME }}

jobs:
  validate-and-promote:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Target SHA
        run: |
          TARGET_SHA="${{ inputs.commit_sha }}"
          if [ -z "$TARGET_SHA" ]; then
            TARGET_SHA="${{ github.sha }}"
          fi
          echo "TARGET_SHA=$TARGET_SHA" >> $GITHUB_ENV
          echo "Target SHA set to: $TARGET_SHA"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Start the serving container to validate the trained model
      - name: Start serving container
        env:
          SERVING_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/serving:${{ env.TARGET_SHA }}
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MLFLOW_EXPERIMENT_NAME: ${{ env.MLFLOW_EXPERIMENT_NAME }}
          SERVING_PORT: 8080
        run: |
          docker compose up -d --pull always serving

          # Wait for FastAPI to be ready
          sleep 10

      # Run end to end tests, this will test the serving app to see if it is working ok
      - name: Run Staging tests
        run: uv run pytest tests/test_e2e.py -v

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== FastAPI logs ==="
          docker logs serving-app || true

      # Tag serving image with staging and push to repository
      - name: Push serving staging image
        run: |
          docker tag ${{ env.REGISTRY }}/${{ github.repository }}/serving:${{ env.TARGET_SHA }} \
                     ${{ env.REGISTRY }}/${{ github.repository }}/serving:staging
          docker push ${{ env.REGISTRY }}/${{ github.repository }}/serving:staging

      # Promote selected model to staging to be further validated
      - name: Promote model to staging
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MLFLOW_MODEL_NAME: ${{ env.MLFLOW_MODEL_NAME }}
          FROM_ALIAS: best
          TO_ALIAS: staging
        run: |
          set -xe
          uv run python -u model_promotion/promote_model.py
